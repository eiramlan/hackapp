# .github/workflows/cve-demo-scan.yml
name: CVE Demo Scan (Trivy)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

env:
  IMAGE_TAG: hackapp:${{ github.sha }}

jobs:
  trivy_demo:
    name: One-off CVE scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application (quick)
        run: ./mvnw -q -DskipTests clean install

      - name: Build container image
        run: docker build -t $IMAGE_TAG .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: '0.67.0'              # pin Trivy engine
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: '0'                 # keep the run green for the demo

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
